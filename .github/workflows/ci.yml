name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: miobots-ganglion
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          repository: Miobots/protocol
          path: miobots-protocol
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
        working-directory: miobots-ganglion
      # The screenshot tool shrinks captures with ffmpeg at runtime (GANGLION_DECISIONS 33); test it for real.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: bun test
        working-directory: miobots-ganglion
      - run: bun run typecheck
        working-directory: miobots-ganglion
